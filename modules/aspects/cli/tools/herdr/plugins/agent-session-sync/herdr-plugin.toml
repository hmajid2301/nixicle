id = "agent-session-sync"
name = "Agent Session Sync"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Mirror remote agent transcripts locally, and promote one back into the live store"
platforms = ["linux", "macos"]

# Browse mirrored sessions and promote one. Popup keeps the layout untouched —
# you are usually mid-task when you reach for this. Note herdr rejects width and
# height on any placement other than popup.
[[panes]]
id = "picker"
title = "Mirrored agent sessions"
placement = "popup"
width = "90%"
height = 22
command = ["sh", "picker.sh"]

[[actions]]
id = "open"
title = "Sessions: browse mirrored transcripts"
contexts = ["workspace"]
command = ["sh", "open-picker.sh"]

[[actions]]
id = "sync-now"
title = "Sessions: sync all hosts now"
contexts = ["workspace"]
command = ["sh", "sync-now.sh"]

[[actions]]
id = "check-stale"
title = "Sessions: check mirror freshness"
contexts = ["workspace"]
command = ["sh", "check-stale.sh"]

# A mirror going stale is the failure worth interrupting for — a sync that
# works is unremarkable. Checked on startup rather than on a timer, since
# systemd owns the sync schedule.
[[startup]]
command = ["sh", "check-stale.sh"]
