build:nixos-config:
  extends: .base_setup
  stage: build
  # Keep matrix in sync with `nix eval --json .#nixosConfigurations --apply builtins.attrNames`.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  parallel:
    matrix:
      - CONFIG_NAME: ["desktop", "framebox", "framework", "gateway", "nas", "rpi", "vm", "vps"]
  script:
    - echo "Building nixosConfigurations.${CONFIG_NAME}..."
    - nix build ".#nixosConfigurations.${CONFIG_NAME}.config.system.build.toplevel" --print-build-logs

build:home-config:
  extends: .base_setup
  stage: build
  # Keep matrix in sync with `nix eval --json .#homeConfigurations --apply builtins.attrNames`.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  parallel:
    matrix:
      - CONFIG_NAME: ["haseeb@desktop", "haseeb@framebox", "haseeb@framework", "haseebmajid@dell"]
  script:
    - echo "Building homeConfigurations.${CONFIG_NAME}..."
    - nix build ".#homeConfigurations.${CONFIG_NAME}.activationPackage" --print-build-logs

build:flake:
  extends: .base_setup
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - nix flake update
    - nix run github:Mic92/nix-fast-build -- --skip-cached --no-nom --max-jobs 4
    - echo "Building representative scheduled system configurations..."
    - for host in framework vm framebox; do
        echo "Building nixosConfigurations.$host...";
        nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --print-build-logs;
      done
    - echo "Building selected packages..."
    - nix build ".#packages.x86_64-linux.install" --print-build-logs
    - nix build ".#packages.x86_64-linux.kaf" --print-build-logs
    - nix build ".#packages.x86_64-linux.octopus-energy" --print-build-logs

