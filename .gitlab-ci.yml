image: nixos/nix

stages:
  - lint
  - update
  - build

lint:fmt:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - mkdir -p /etc/nix
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      EOF
  script:
    - nix-env -iA nixpkgs.nixfmt nixpkgs.go-task
    - task fmt

lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - mkdir -p /etc/nix
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      EOF
  script:
    - nix-env -iA nixpkgs.go-task nixpkgs.deadnix
    - task lint

.base_setup:
  before_script:
    - mkdir -p /etc/nix
    - mkdir -p /var/lib/papirus-folders
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      extra-platforms = x86_64-linux i686-linux
      system-features = benchmark big-parallel nixos-test i686
      substituters = https://attic.haseebmajid.dev/main https://nix-community.cachix.org?priority=41 https://numtide.cachix.org?priority=42 https://cache.nixos.org/
      trusted-public-keys = main:+A4BR+E8F8FNe1YR6Uq8qGO5dVj8y1kaalW3kQ0WgXo= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE=
      max-jobs = 4
      cores = 2
      EOF
    - mkdir -p ~/.ssh /etc/ssh
    - chmod 700 ~/.ssh
    - ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
    - ssh-keygen -t ed25519 -N "" -f /etc/ssh/ssh_host_ed25519_key
    - |
      cat >> ~/.ssh/config << EOF
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
      EOF
    - export SSH_ASKPASS_REQUIRE=never
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519 2>/dev/null
    - nix-env -iA nixpkgs.attic-client nixpkgs.cacert nixpkgs.git nixpkgs.go-task

update:flake:
  extends: .base_setup
  stage: update
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "Updating flake inputs..."
    - nix flake update
    - nix run github:Mic92/nix-fast-build -- --flake '.#framebox' --skip-cached --no-nom --max-jobs 2
    - |
      if git diff --quiet -- flake.lock; then
        echo "No flake.lock changes to commit."
        exit 0
      fi

      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@gitlab.com"

      BRANCH_NAME="automated/flake-update-$(date +%Y-%m-%d)"
      git checkout -b "$BRANCH_NAME"
      git add flake.lock
      git commit -m "chore: weekly flake update $(date +%Y-%m-%d)" \
                 -m "Automated flake update from scheduled pipeline." \
                 -m "🤖 Generated by GitLab CI"

      git push -o ci.skip -o merge_request.create \
        -o merge_request.target=${CI_DEFAULT_BRANCH:-main} \
        -o merge_request.title="chore: Weekly flake update $(date +%Y-%m-%d)" \
        -o merge_request.description="Automated scheduled flake update. Representative build completed successfully in CI." \
        -o merge_request.label="dependencies" \
        -o merge_request.label="automated" \
        https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git "$BRANCH_NAME"

build:nixos-config:
  extends: .base_setup
  stage: build
  # Keep matrix in sync with `nix eval --json .#nixosConfigurations --apply builtins.attrNames`.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  parallel:
    matrix:
      - CONFIG_NAME: ["desktop", "framebox", "framework", "gateway", "nas", "rpi", "vm", "vps"]
  script:
    - echo "Building nixosConfigurations.${CONFIG_NAME}..."
    - nix build ".#nixosConfigurations.${CONFIG_NAME}.config.system.build.toplevel" --print-build-logs

build:home-config:
  extends: .base_setup
  stage: build
  # Keep matrix in sync with `nix eval --json .#homeConfigurations --apply builtins.attrNames`.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  parallel:
    matrix:
      - CONFIG_NAME: ["haseeb@desktop", "haseeb@framebox", "haseeb@framework", "haseebmajid@dell"]
  script:
    - echo "Building homeConfigurations.${CONFIG_NAME}..."
    - nix build ".#homeConfigurations.${CONFIG_NAME}.activationPackage" --print-build-logs

build:flake:
  extends: .base_setup
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - test -n "$ATTIC_TOKEN"
    - attic login --set-default ci https://attic.haseebmajid.dev "$ATTIC_TOKEN"
    - nix flake update
    - nix run github:Mic92/nix-fast-build -- --skip-cached --no-nom --max-jobs 4
    - rm -f attic-paths.txt
    - echo "Building scheduled NixOS configurations and collecting outputs..."
    - |
      for host in desktop framebox framework gateway nas rpi vm vps; do
        echo "Building nixosConfigurations.$host..."
        nix build ".#nixosConfigurations.$host.config.system.build.toplevel" \
          --print-build-logs --no-link --print-out-paths | tee -a attic-paths.txt
      done
    - echo "Building scheduled Home Manager configurations and collecting outputs..."
    - |
      for home in 'haseeb@desktop' 'haseeb@framebox' 'haseeb@framework' 'haseebmajid@dell'; do
        echo "Building homeConfigurations.$home..."
        nix build ".#homeConfigurations.$home.activationPackage" \
          --print-build-logs --no-link --print-out-paths | tee -a attic-paths.txt
      done
    - echo "Building selected packages and collecting outputs..."
    - nix build ".#packages.x86_64-linux.install" --print-build-logs --no-link --print-out-paths | tee -a attic-paths.txt
    - nix build ".#packages.x86_64-linux.kaf" --print-build-logs --no-link --print-out-paths | tee -a attic-paths.txt
    - nix build ".#packages.x86_64-linux.octopus-energy" --print-build-logs --no-link --print-out-paths | tee -a attic-paths.txt
    - sort -u attic-paths.txt -o attic-paths.txt
    - echo "Pushing built outputs to Attic cache..."
    - xargs -r attic push main < attic-paths.txt

