image: nixos/nix

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - lint
  - build
  - repair

.lint_setup:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - mkdir -p /etc/nix
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      EOF

lint:fmt:
  extends: .lint_setup
  script:
    - nix-env -iA nixpkgs.nixfmt nixpkgs.go-task
    - task fmt

lint:
  extends: .lint_setup
  script:
    - nix-env -iA nixpkgs.go-task nixpkgs.deadnix
    - task lint

.base_setup:
  before_script:
    - mkdir -p /etc/nix /var/lib/papirus-folders /root/.config/nix
    - export ATTIC_AUTH_KEY="${ATTIC_AUTH_KEY//[$'\r\n']/}"
    - printf 'machine attic.haseebmajid.dev\npassword %s\n' "$ATTIC_AUTH_KEY" > /root/.config/nix/netrc
    - chmod 600 /root/.config/nix/netrc
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      extra-platforms = x86_64-linux i686-linux
      system-features = benchmark big-parallel nixos-test i686
      substituters = https://attic.haseebmajid.dev/main https://nix-community.cachix.org?priority=41 https://numtide.cachix.org?priority=42 https://cache.nixos.org/
      trusted-public-keys = main:+A4BR+E8F8FNe1YR6Uq8qGO5dVj8y1kaalW3kQ0WgXo= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE=
      netrc-file = /root/.config/nix/netrc
      fallback = true
      max-jobs = 4
      cores = 2
      EOF
    - |
      GITHUB_ACCESS_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
      if [ -n "$GITHUB_ACCESS_TOKEN" ]; then
        printf 'access-tokens = github.com=%s\n' "$GITHUB_ACCESS_TOKEN" >> /etc/nix/nix.conf
      else
        echo "No GITHUB_TOKEN/GH_TOKEN set; GitHub flake fetches may hit rate limits"
      fi
    - nix-env -iA nixpkgs.attic-client nixpkgs.cacert

.build:nixos:
  extends: .base_setup
  stage: build
  timeout: 2h
  resource_group: nix-builds
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: ["flake.lock"]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["flake.lock"]
  script:
    - test -n "$ATTIC_AUTH_KEY"
    - attic login --set-default ci https://attic.haseebmajid.dev "$ATTIC_AUTH_KEY"
    - echo "Building ${NIXOS_CONFIG} with nix-fast-build and auto-pushing to Attic..."
    - |
      nix run github:Mic92/nix-fast-build -- \
        --flake ".#nixosConfigurations.${NIXOS_CONFIG}.config.system.build.toplevel" \
        --stream-json-lines --skip-cached --no-nom --max-jobs 4 \
        --attic-cache main --attic-push-build-closure

build:desktop:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: desktop

build:vps:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: vps

build:nas:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: nas

repair:
  extends: .base_setup
  stage: repair
  timeout: 1h
  services:
    - name: ollama/ollama:latest
      alias: ollama
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//'
      when: on_failure
    - when: never
  script:
    - bash scripts/ci-repair.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - repair/
