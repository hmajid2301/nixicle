image: nixpkgs/nix-flakes:nixos-26.05-x86_64-linux

.tofu_rules: &tofu_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - "infra/opentofu/**/*"
  - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  - if: $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH
    changes:
      - "infra/opentofu/**/*"

include:
  - component: gitlab.com/components/opentofu/validate-plan-apply@4.9.1
    inputs:
      opentofu_version: 1.12.6
      root_dir: infra/opentofu
      stage_validate: lint
      stage_build: build
      stage_deploy: deploy
      auto_define_backend: true
      use_lockfile_for_cache_key: true
      fmt_rules: *tofu_rules
      validate_rules: *tofu_rules
      plan_rules: *tofu_rules

.tofu_tailscale: &tofu_tailscale
  before_script:
    - test -n "$TS_AUTHKEY"
    - nix --extra-experimental-features "nix-command flakes" profile add nixpkgs#tailscale nixpkgs#iptables >/dev/null
    - mkdir -p /dev/net
    - test -c /dev/net/tun || mknod /dev/net/tun c 10 200
    - tailscaled --state="mem:" &
    - timeout 15 sh -c 'until [ -S /var/run/tailscale/tailscaled.sock ]; do sleep 1; done'
    - tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-tofu-${CI_JOB_ID}" --timeout=60s
  after_script:
    - tailscale logout

plan:
  <<: *tofu_tailscale

apply:
  <<: *tofu_tailscale

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.nix_changes: &nix_changes
  - "flake.nix"
  - "flake.lock"
  - "hosts/**/*"
  - "lib/**/*"
  - "modules/**/*"
  - "packages/**/*"

stages:
  - lint
  - build
  - repair
  - deploy

.lint_setup:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /etc/nix
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      EOF

lint:fmt:
  extends: .lint_setup
  script:
    - nix fmt -- --fail-on-change

lint:
  extends: .lint_setup
  script:
    - nix develop --command bash -c 'files=$(git ls-files "*.nix"); deadnix --fail $files; statix check .'

.base_setup:
  before_script:
    - mkdir -p /etc/nix /var/lib/papirus-folders /root/.config/nix
    - export ATTIC_AUTH_KEY="${ATTIC_AUTH_KEY//[$'\r\n']/}"
    - printf 'machine attic.haseebmajid.dev\npassword %s\n' "$ATTIC_AUTH_KEY" > /root/.config/nix/netrc
    - chmod 600 /root/.config/nix/netrc
    - |
      cat >> /etc/nix/nix.conf << EOF
      experimental-features = nix-command flakes
      extra-platforms = x86_64-linux i686-linux
      system-features = benchmark big-parallel nixos-test i686
      substituters = https://attic.haseebmajid.dev/main https://nix-community.cachix.org?priority=41 https://numtide.cachix.org?priority=42 https://cache.nixos.org/
      trusted-public-keys = main:+A4BR+E8F8FNe1YR6Uq8qGO5dVj8y1kaalW3kQ0WgXo= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE=
      netrc-file = /root/.config/nix/netrc
      fallback = true
      max-jobs = 2
      cores = 2
      EOF
    - |
      GITHUB_ACCESS_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
      if [ -n "$GITHUB_ACCESS_TOKEN" ]; then
        printf 'access-tokens = github.com=%s\n' "$GITHUB_ACCESS_TOKEN" >> /etc/nix/nix.conf
      else
        echo "No GITHUB_TOKEN/GH_TOKEN set; GitHub flake fetches may hit rate limits"
      fi

.build:nixos:
  extends: .base_setup
  stage: build
  timeout: 2h
  resource_group: nix-builds
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *nix_changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *nix_changes
  script:
    - mkdir -p build-logs
    - test -n "$ATTIC_AUTH_KEY"
    - attic login --set-default ci https://attic.haseebmajid.dev "$ATTIC_AUTH_KEY"
    - echo "Building ${NIXOS_CONFIG}, then pushing its closure to Attic..."
    - |
      set -euo pipefail
      nix build ".#nixosConfigurations.${NIXOS_CONFIG}.config.system.build.toplevel" \
        --out-link "build-result-${NIXOS_CONFIG}" --max-jobs 2 -L \
        2>&1 | tee "build-logs/${NIXOS_CONFIG}.log"
    - |
      attic push main --jobs 1 "$(readlink -f "build-result-${NIXOS_CONFIG}")" \
        2>&1 | tee -a "build-logs/${NIXOS_CONFIG}.log"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build-logs/

build:desktop:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: desktop

build:vps:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: vps

check:nixos-evaluations:
  extends: .base_setup
  stage: build
  timeout: 2h
  resource_group: nix-builds
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *nix_changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *nix_changes
  script:
    # Avoid stale cached .drv paths on persistent runners after store GC.
    - nix flake check --no-build --option eval-cache false
    - |
      for host in desktop framework nas rpi vm vps; do
        nix eval --option eval-cache false ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
      done

build:nas:
  extends: .build:nixos
  variables:
    NIXOS_CONFIG: nas

repair:
  extends: .base_setup
  stage: repair
  timeout: 1h
  interruptible: false
  variables:
    OLLAMA_BASE_URL: https://ollama.com/api/chat
    OLLAMA_MODEL: deepseek-v4-pro
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//'
      when: always
    - when: never
  script:
    - nix shell nixpkgs#curl nixpkgs#jq nixpkgs#gnused -c bash scripts/ci-repair.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - repair/

.deploy:
  extends: .base_setup
  stage: deploy
  timeout: 1h
  interruptible: false
  resource_group: deploy-${DEPLOY_HOST}
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - test -n "$TS_AUTHKEY"
    - nix profile add nixpkgs#tailscale >/dev/null
    - tailscaled --state=mem 2>/dev/null &
    - sleep 2
    - tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-deploy-${DEPLOY_HOST}" --ssh --timeout=60s
    - mkdir -p /root/.ssh && chmod 700 /root/.ssh
    - ssh-keyscan -H "${DEPLOY_HOST}" >> /root/.ssh/known_hosts
    - ssh -o BatchMode=yes root@${DEPLOY_HOST} true
    - nix develop --command deploy .#${DEPLOY_HOST} --hostname "${DEPLOY_HOST}" --ssh-user root --profile-user root --skip-checks

deploy:vps:
  extends: .deploy
  variables:
    DEPLOY_HOST: vps

deploy:nas:
  extends: .deploy
  variables:
    DEPLOY_HOST: nas
