version: '3'

vars:
  TF_DIR: infra/opentofu
  VAR_FILE: terraform.tfvars

tasks:
  init:
    desc: Initialize OpenTofu with GitLab-managed state (requires glab authentication)
    dir: '{{.TF_DIR}}'
    cmds:
      - glab opentofu init -R '{{.GITLAB_PROJECT | default "hmajid2301/nixicle"}}' '{{.STATE | default "default"}}' -- -reconfigure

  validate:
    desc: Validate OpenTofu config without backend access
    dir: '{{.TF_DIR}}'
    cmds:
      - rm -rf .terraform
      - tofu init -backend=false
      - tofu validate

  plan:
    desc: Plan Pocket ID OpenTofu resources (requires Pocket ID + backend env)
    dir: '{{.TF_DIR}}'
    cmds:
      - task: init
      - tofu plan -var-file={{.VAR_FILE}}

  apply:
    desc: Apply Pocket ID OpenTofu resources (manual, requires Pocket ID + backend env)
    dir: '{{.TF_DIR}}'
    cmds:
      - task: init
      - tofu apply -var-file={{.VAR_FILE}}

  import:
    desc: >-
      Import an existing Pocket ID resource into OpenTofu state. Usage: task tofu:import ADDRESS='pocketid_client.app["grafana"]' ID=grafana
    dir: '{{.TF_DIR}}'
    env:
      IMPORT_ADDRESS: '{{.ADDRESS}}'
      IMPORT_ID: '{{.ID}}'
    cmds:
      - task: init
      - tofu import -var-file={{.VAR_FILE}} "$IMPORT_ADDRESS" "$IMPORT_ID"
