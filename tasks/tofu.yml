version: '3'

vars:
  TF_DIR: infra/opentofu
  VAR_FILE: terraform.tfvars

tasks:
  init:
    desc: Init OpenTofu working dir for Pocket ID resources (requires backend env for remote state)
    dir: '{{.TF_DIR}}'
    cmds:
      - tofu init

  validate:
    desc: Validate OpenTofu config without backend access
    dir: '{{.TF_DIR}}'
    cmds:
      - rm -rf .terraform
      - tofu init -backend=false
      - tofu validate

  plan:
    desc: Plan Pocket ID OpenTofu resources (requires Pocket ID + backend env)
    dir: '{{.TF_DIR}}'
    cmds:
      - tofu init
      - tofu plan -var-file={{.VAR_FILE}}

  apply:
    desc: Apply Pocket ID OpenTofu resources (manual, requires Pocket ID + backend env)
    dir: '{{.TF_DIR}}'
    cmds:
      - tofu init
      - tofu apply -var-file={{.VAR_FILE}}

  import:
    desc: "Import an existing Pocket ID resource into OpenTofu state. Usage: task tofu:import ADDRESS='pocketid_client.app["grafana"]' ID=grafana"
    dir: '{{.TF_DIR}}'
    cmds:
      - tofu init
      - tofu import -var-file={{.VAR_FILE}} "{{.ADDRESS}}" "{{.ID}}"
